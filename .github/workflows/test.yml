name: Test

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Type-check and run logic tests
        run: npm test
      - name: Build the bundle
        run: npm run build
